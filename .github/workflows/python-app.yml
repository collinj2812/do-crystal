name: Python application

on:
  push:
    branches: [ "main", "PID" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cristalizador_cambios_revisar
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: Cristalizador_cambios_revisar/requirements.txt
    - name: Instalar dependencias
      run: pip install -r requirements.txt flake8
    - name: Lint (errores graves, nombres indefinidos y funciones repetidas)
      run: flake8 msmpr_core tests --count --select=E9,F63,F7,F82,F401,F841,F811 --show-source --statistics
    - name: Pruebas
      run: python -m pytest tests -q
